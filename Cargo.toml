[package]
name = "core_api"
version = "0.1.0"
edition = "2021"
description = "Core API for mairie360: users, sessions/auth, roles, groups and resource-access management"
license = "MIT"
repository = "https://github.com/mairie360/Core_API"
keywords = ["mairie360", "actix-web", "api", "auth"]
categories = ["web-programming", "database"]

[dependencies]
actix-web = "4"
async-trait = "0.1.89"
base64 = "0.23.0"
chrono = { version = "0.4", features = ["serde"] }
# IANA time zone names accepted by the `timezone` preference (MAIR-479).
chrono-tz = "0.10.4"
futures-util = "0.3"
# Trusted reverse proxies of `client_ip` (CIDR ranges).
ipnet = "2.12"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls", "ring", "webpki-roots", "builder"] }
mairie360_api_lib = "3.0.0"
percent-encoding = "2.3"
# Phone numbers validated against the numbering plan of their country (MAIR-480).
phonenumber = "0.3.10"
# OpenTelemetry (MAIR-131). `tracing-actix-web` only supports OpenTelemetry up to 0.32 and
# `tracing-opentelemetry` 0.33 is the release paired with it: bump all of them together.
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = "0.32"
tracing-actix-web = { version = "0.7.25", features = ["opentelemetry_0_32"] }
tracing-opentelemetry = "0.33"
rand = "0.10"
reqwest = { version = "0.13.4", features = ["json", "form"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
# Digest of the refresh tokens stored in `sessions.token_hash`.
sha2 = "0.11"
# Only to read the SQLSTATE of a `DbError::Sqlx` (same version as mairie360_api_lib).
sqlx = { version = "0.9.0", default-features = false }
tokio = { version = "1.50.1", features = ["full"] }
tokio-postgres = "0.7.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
utoipa = { version = "6", features = ["actix_extras", "yaml"] }
utoipa-swagger-ui = { version = "10", features = ["actix-web"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
mairie360_api_lib = { version = "3.0.0", features = ["test-utils"] }
# In-memory span exporter to assert on the exported spans (MAIR-131).
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
# Same major as mairie360_api_lib: raw connection to read the TTL of the revocation keys in tests.
redis = "1.0.3"
# Redis enforcing the chart's ACL in tests (same version as mairie360_api_lib's test_setup).
testcontainers = "0.28.0"
serial_test = "4.0.0"
url = "2.5"
once_cell = "1.21.3"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "chrono", "uuid"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
