[package]
name = "core_api"
version = "0.1.0"
edition = "2021"
description = "Core API for mairie360: users, sessions/auth, roles, groups and resource-access management"
license = "MIT"
repository = "https://github.com/mairie360/Core_API"
keywords = ["mairie360", "actix-web", "api", "auth"]
categories = ["web-programming", "database"]

[dependencies]
actix-web = "4"
async-trait = "0.1.89"
base64 = "0.23.0"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls", "ring", "webpki-roots", "builder"] }
# Bumped ahead of the actual crates.io release: 1.3.0 is the version mairie360_api_lib#132
# (feat(password): add argon2id hashing module) will publish as once merged (feat -> minor bump
# per its semantic-release config). Do not merge this PR before that version exists on
# crates.io, see the PR discussion.
mairie360_api_lib = "1.3.0"
rand = "0.10"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.50.1", features = ["full"] }
tokio-postgres = "0.7.17"
utoipa = { version = "6", features = ["actix_extras", "yaml"] }
utoipa-swagger-ui = { version = "10", features = ["actix-web"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
serial_test = "4.0.0"
once_cell = "1.21.3"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "chrono", "uuid"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
