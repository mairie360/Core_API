[package]
name = "core_api"
version = "0.1.0"
edition = "2021"
description = "Core API for mairie360: users, sessions/auth, roles, groups and resource-access management"
license = "MIT"
repository = "https://github.com/mairie360/Core_API"
keywords = ["mairie360", "actix-web", "api", "auth"]
categories = ["web-programming", "database"]

[dependencies]
actix-web = "4"
# TOTP second factor (MAIR-805): the secret is sealed with AES-256-GCM before it reaches the database.
aes-gcm = "0.10"
async-trait = "0.1.89"
base64 = "0.23.0"
chrono = { version = "0.4", features = ["serde"] }
# IANA time zone names accepted by the `timezone` preference (MAIR-479).
chrono-tz = "0.10.4"
# Base32 of the TOTP secret (`otpauth://` URI and manual entry).
data-encoding = "2.9"
futures-util = "0.3"
# HMAC-SHA1 of RFC 6238 (every authenticator application speaks SHA-1).
hmac = "0.13"
# Trusted reverse proxies of `client_ip` (CIDR ranges).
ipnet = "2.12"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
# Only `lettre::Address`, to validate e-mail addresses (the e-mails themselves go through Resend).
lettre = { version = "0.11", default-features = false }
# Logs and OpenTelemetry traces (MAIR-503): `logging::telemetry` and its re-exports.
# `tracing-actix`: `request_log`, the root span without the query string nor the error `Debug`
# (MAIR-290).
mairie360_api_lib = { version = "4.4.0", features = ["otel", "tracing-actix"] }
percent-encoding = "2.3"
# Phone numbers validated against the numbering plan of their country (MAIR-480).
phonenumber = "0.3.10"
rand = "0.10"
reqwest = { version = "0.13.4", features = ["json", "form"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
# Digest of the refresh tokens stored in `sessions.token_hash`.
sha1 = "0.11"
sha2 = "0.11"
# Constant-time comparison of the codes.
subtle = "2.6"
# Only to read the SQLSTATE of a `DbError::Sqlx` (same version as mairie360_api_lib).
sqlx = { version = "0.9.0", default-features = false }
tokio = { version = "1.50.1", features = ["full"] }
tokio-postgres = "0.7.17"
tracing = "0.1.44"
utoipa = { version = "6", features = ["actix_extras", "yaml"] }
utoipa-swagger-ui = { version = "10", features = ["actix-web"] }
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation", "preview-features"] }

[dev-dependencies]
mairie360_api_lib = { version = "4.4.0", features = ["test-utils"] }
# Same major as mairie360_api_lib: raw connection to read the TTL of the revocation keys in tests.
redis = "1.0.3"
# Redis enforcing the chart's ACL in tests (same version as mairie360_api_lib's test_setup).
testcontainers = "0.28.0"
serial_test = "4.0.0"
# access-matrix.yaml (MAIR-288); already in the tree through utoipa's `yaml` feature.
yaml_serde = "0.10"
url = "2.5"
once_cell = "1.21.3"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "chrono", "uuid"] }
# Subscriber of the telemetry tests (registry + the lib's trace layer).
tracing-subscriber = "0.3.23"
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }

[profile.dev]
opt-level = 0

# MAIR-1002: the dependencies are optimised, only the code of this API stays in debug (what the coverage
# measures). In debug, argon2 and the TLS/crypto stack made each login about 0.5 s, so the rate limit
# tests (30 logins) took about 17 s each.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
