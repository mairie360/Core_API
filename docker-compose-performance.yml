volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 3000
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_HOST: postgres
  DB_PASSWORD: password
  DB_PORT: 5432

x-depends-on: &depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:3000"]
  interval: 10s
  timeout: 5s
  retries: 5

x-service: &service-template
  image: ghcr.io/mairie360/service_name:latest
  pull_policy: always
  restart: always
  expose:
    - "3000"
  networks:
    - backend
  healthcheck:
    <<: *healthcheck

services:
  postgres:
    image: ghcr.io/mairie360/database:dev-0aaede5
    restart: always
    container_name: mairie360-db-core-api
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:dev-0aaede5
    container_name: mairie360-liquibase-core-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-core-api
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    container_name: core-api-developpement
    # The API under test: the published ghcr.io/mairie360/core-api:dev-<sha> image in CI, or
    # core-api:local built by the *_test.sh script from development.Dockerfile. No build: block,
    # so CI tests the artifact that gets promoted instead of recompiling the sources.
    image: ${IMAGE_REF:?IMAGE_REF must name the API image under test, run the matching *_test.sh script}
    restart: always
    ports:
      - "3000:3000"
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *common-env
      PUBLIC_URL: http://core.development.mairie360.fr
      JWT_SECRET: b"secret"
      JWT_TIMEOUT: 3600
      SMTP_HOST: "mailpit" # Nom du service docker
      SMTP_PORT: "1025" # Port SMTP de mailpit
      SMTP_USERNAME: "" # Pas besoin d'authentification en local
      SMTP_PASSWORD: "" # Pas besoin d'authentification en local
      EMAIL_FROM: "noreply.mairie360@dev.local"
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The published image is distroless (no shell, no curl), so the API cannot carry its own
  # healthcheck: this sidecar polls /health and the services that need the API wait for it to
  # complete instead.
  core-ready:
    image: curlimages/curl:latest
    depends_on:
      core:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core:3000/health >/dev/null; do
      echo "waiting for core..."; sleep 2; done; echo "core ready"'
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.31
    container_name: mairie360-mailpit
    restart: always
    ports:
      - "8025:8025" # Interface Web pour voir les mails (http://localhost:8025)
      - "1025:1025" # Le port SMTP pour ton code Rust
    networks:
      - backend
    depends_on:
      core-ready:
        condition: service_completed_successfully

  # nginx:
  #   image: nginx:1.29.1-bookworm
  #   restart: always
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #   ports:
  #     - "80:80"
  #   networks:
  #     - backend
  #   depends_on:
  #     mailpit:
  #       condition: service_healthy

  k6-perf-test:
    image: grafana/k6:latest
    networks:
      - backend
    volumes:
      - ./load-test.js:/load-test.js
    command: ["run", "/load-test.js"]
    environment:
      - BASE_URL=http://core:3000
    depends_on:
      core-ready:
        condition: service_completed_successfully
