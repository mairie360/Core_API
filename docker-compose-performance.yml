volumes:
  postgres-data:
  redis-data:
  openapi-spec:

networks:
  backend:

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 3000
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  # Core connects with its own role, like in staging/prod (MAIR-556): a query its grants do not
  # cover fails here. The superuser stays for postgres, liquibase and the seeder.
  DB_USER: core_api
  DB_HOST: postgres
  DB_PASSWORD: core-api-password
  DB_PORT: 5432

x-depends-on: &depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:3000"]
  interval: 10s
  timeout: 5s
  retries: 5

x-service: &service-template
  image: ghcr.io/mairie360/service_name:latest
  pull_policy: always
  restart: always
  expose:
    - "3000"
  networks:
    - backend
  healthcheck:
    <<: *healthcheck

services:
  postgres:
    image: ghcr.io/mairie360/database:dev-90c22bb
    restart: always
    container_name: mairie360-db-core-api
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:dev-90c22bb
    container_name: mairie360-liquibase-core-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 refuses to seed the admin (users.id = 1) without credentials: this
    # throwaway stack uses the public template admin. Never pass the flag on a real instance.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
      -Dcore_api_password=core-api-password
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-core-api
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seeder:
    image: postgres:18-alpine
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
      # Data volume of the load test (MAIR-474), on top of the fixtures: k6 stack only.
      - ./init-perf.sql:/init-perf.sql:ro
    # ON_ERROR_STOP: a failing fixture must fail the stack, not leave k6 running without its users.
    command: >
      psql -h postgres -U postgres -d mairie_360_database -v ON_ERROR_STOP=1
      -f /init-test.sql -f /init-perf.sql
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
    networks:
      - backend

  core:
    container_name: core-api-developpement
    # The API under test: the published ghcr.io/mairie360/core-api:dev-<sha> image in CI, or
    # core-api:local built by the *_test.sh script from development.Dockerfile. No build: block,
    # so CI tests the artifact that gets promoted instead of recompiling the sources.
    image: ${IMAGE_REF:?IMAGE_REF must name the API image under test, run the matching *_test.sh script}
    restart: always
    ports:
      - "3000:3000"
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *common-env
      PUBLIC_URL: http://core.development.mairie360.fr
      # Random per run, generated by stack_secrets.sh (MAIR-428): run the matching *_test.sh script.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
      # Serves Swagger UI and /api-docs/openapi.json (MAIR-424), off in production.
      SWAGGER_ENABLED: "true"
      # E-mails go to the fake Resend (MAIR-522), from no-reply@mairie360.local.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend:8080"
      EMAIL_DOMAIN: "mairie360.local"
      EMAIL_SENDER_NAME: "Mairie 360 (test)"
      # resend_rs throttles each process to bursts of RESEND_RATE_LIMIT e-mails (default 9), then
      # one per 1.1 s, to stay under Resend's quota. The fake Resend has none: let k6's password
      # resets through instead of measuring that queue.
      RESEND_RATE_LIMIT: "100000"
      # k6 logs in, refreshes and resets passwords far beyond the auth rate limits (MAIR-390).
      RATE_LIMIT_ENABLED: "false"
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The published image is distroless (no shell, no curl), so the API cannot carry its own
  # healthcheck: this sidecar polls /ready (Postgres and Redis reachable) and the services that need the API wait for it to
  # complete instead.
  # It also saves the spec served by the image under test into the `openapi-spec` volume: that
  # is the coverage reference of load-test.js (openapi.json is gitignored, so the CI checkout has
  # none, and the served spec is the one of the exact image being tested).
  core-ready:
    image: curlimages/curl:latest
    # Root, to write into the freshly created `openapi-spec` volume.
    user: "0"
    depends_on:
      core:
        condition: service_started
    volumes:
      - openapi-spec:/spec
    command: >
      sh -c 'until curl -fsS http://core:3000/ready >/dev/null; do
      echo "waiting for core..."; sleep 2; done;
      curl -fsS -o /spec/openapi.json http://core:3000/api-docs/openapi.json && echo "core ready"'
    networks:
      - backend

  # Fake Resend API (MAIR-522): records the e-mails Core sends (tests/fake-resend/README.md).
  fake-resend:
    image: wiremock/wiremock:3.13.2
    container_name: mairie360-fake-resend
    restart: always
    command: ["--port", "8080", "--global-response-templating", "--max-request-journal-entries", "10000"]
    volumes:
      - ./tests/fake-resend/mappings:/home/wiremock/mappings:ro
    expose:
      - "8080"
    networks:
      - backend

  k6-perf-test:
    image: grafana/k6:latest
    networks:
      - backend
    # load-test.js declares one handler per operation of the spec through the shared OpenAPI
    # coverage module (MAIR-194, mairie360/CICD tests/k6, see performance_test.sh): k6 aborts at
    # init when an operation has no handler, and fails its thresholds when one is not exercised.
    volumes:
      - ./load-test.js:/load-test.js:ro
      - ./cicd-repo/tests/k6/coverage.js:/coverage.js:ro
      - openapi-spec:/spec:ro
    command: ["run", "/load-test.js"]
    environment:
      - BASE_URL=http://core:3000
      - OPENAPI_SPEC=/spec/openapi.json
      - FAKE_RESEND_URL=http://fake-resend:8080
      # Admin JWT signed with this run's JWT_SECRET (stack_secrets.sh, MAIR-428).
      - JWT=${ADMIN_JWT:?ADMIN_JWT must be set, run performance_test.sh}
      # Load profile of load-test.js: `ci` (default, sized for the CI runner) or `stress` (MAIR-474).
      - K6_PROFILE=${K6_PROFILE:-ci}
    depends_on:
      core-ready:
        condition: service_completed_successfully
      # The fixtures load-test.js relies on (init-test.sql).
      seeder:
        condition: service_completed_successfully
      # load-test.js reads the password reset e-mails from the fake Resend's request journal.
      fake-resend:
        condition: service_started
