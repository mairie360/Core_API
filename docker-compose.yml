volumes:
  postgres-data:
  redis-data:
  core-target:

networks:
  backend:

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 3000
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  # Core connects with its own role, like in staging/prod (MAIR-556): a query its grants do not
  # cover fails here. The superuser stays for postgres, liquibase and the seeder.
  DB_USER: core_api
  DB_HOST: postgres
  DB_PASSWORD: core-api-password
  DB_PORT: 5432

x-depends-on: &depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:3000"]
  interval: 10s
  timeout: 5s
  retries: 5

x-service: &service-template
  image: ghcr.io/mairie360/service_name:latest
  pull_policy: always
  restart: always
  expose:
    - "3000"
  networks:
    - backend
  healthcheck:
    <<: *healthcheck

services:
  postgres:
    image: ghcr.io/mairie360/database:dev-76437e3
    restart: always
    container_name: mairie360-db-core-api
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:dev-76437e3
    container_name: mairie360-liquibase-core-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 refuses to seed the admin (users.id = 1) without credentials: this
    # throwaway stack uses the public template admin. Never pass the flag on a real instance.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
      -Dcore_api_password=core-api-password
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-core-api
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    container_name: core-api-developpement
    build:
      context: .
      dockerfile: development.Dockerfile
    restart: always
    develop:
      watch:
        - action: sync
          path: ./src
          target: /usr/src/core/src
        - action: sync
          path: ./Cargo.toml
          target: /usr/src/core/Cargo.toml
        - action: sync
          path: ./Cargo.lock
          target: /usr/src/core/Cargo.lock
    ports:
      - "3000:3000"
    volumes:
      - core-target:/usr/src/core/target
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *common-env
      PUBLIC_URL: http://core.development.mairie360.fr
      # Well-known dev value: mairie360_api_lib >= 2.0.0 refuses it at startup unless
      # JWT_ALLOW_WEAK_SECRET is set (MAIR-428). Never set that flag in a real deployment.
      JWT_SECRET: b"secret"
      JWT_ALLOW_WEAK_SECRET: "true"
      JWT_TIMEOUT: 3600
      # Serves Swagger UI and /api-docs/openapi.json (MAIR-424), off in production.
      SWAGGER_ENABLED: "true"
      # E-mails go to the fake Resend (MAIR-522), from no-reply@<EMAIL_DOMAIN>. To send real ones:
      # RESEND_API_KEY=re_… RESEND_BASE_URL=https://api.resend.com EMAIL_DOMAIN=mairie360-eip.fr
      RESEND_API_KEY: ${RESEND_API_KEY:-re_fake_local}
      RESEND_BASE_URL: ${RESEND_BASE_URL:-http://fake-resend:8080}
      EMAIL_DOMAIN: ${EMAIL_DOMAIN:-mairie360.local}
      EMAIL_SENDER_NAME: "Mairie 360 (dev)"
      # Logs: coloured text by default, `LOG_FORMAT: json` for one JSON object per line (MAIR-503).
      # LOG_FORMAT: json
      # OpenTelemetry traces (MAIR-131), off unless an OTLP/HTTP endpoint is set, e.g. a local
      # collector listening on the host: OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318
      # OTEL_SERVICE_NAME: core-api
      # Keycloak SSO (POST /api/v1/auth/keycloak), disabled while these are empty
      KEYCLOAK_REALM_URL: ${KEYCLOAK_REALM_URL:-}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://core:3000/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Fake Resend API (MAIR-522): records the e-mails Core sends (tests/fake-resend/README.md).
  fake-resend:
    image: wiremock/wiremock:3.13.2
    container_name: mairie360-fake-resend
    restart: always
    command: ["--port", "8080", "--global-response-templating", "--max-request-journal-entries", "10000"]
    volumes:
      - ./tests/fake-resend/mappings:/home/wiremock/mappings:ro
    ports:
      - "8025:8080" # Journal of the e-mails sent: http://localhost:8025/__admin/requests
    networks:
      - backend

  nginx:
    image: nginx:1.29.1-bookworm
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    networks:
      - backend
    depends_on:
      core:
        condition: service_healthy
