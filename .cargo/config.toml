[alias]

#This alias check the lint
lint_check = "fmt --all -- --check"

# This alias formats the code
lint_fix = "fmt --all"

# This alias check the code
check_code = "clippy --all-targets --all-features -- -W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo -D warnings"

# This alias generate the OpenAPI documentation
open_api = "run --example generate_openapi"

cov_test = ["llvm-cov", "--workspace", "--ignore-filename-regex", "endpoints|main\\.rs|lib\\.rs", "--fail-under-lines", "60"]

cov = ["llvm-cov", "--workspace", "--ignore-filename-regex", "endpoints|main\\.rs|lib\\.rs", "--fail-under-lines", "60", "--codecov", "--output-path", "codecov.json"]

# Version of the ghcr.io/mairie360/database and liquibase-migrations images the integration tests
# run against (read by mairie360_api_lib::test_setup). Pinned to the latest published dev-<sha> image of Devops/Database (no release has the
# v1.4.0 schema the Keycloak features (user_identities, MAIR-141) need yet).
#
# Held on dev-0aaede5, the image used before MAIR-413 (MAIR-390): from dev-fb7c223 on, the migration
# refuses to seed the admin without credentials or -Dallow_template_admin=true, and the testcontainers
# of mairie360_api_lib 1.4.1 pass neither, so the migration stops half way. Move to the image of the
# compose stacks (and restore the renovate marker) once a lib release passes the flag.
[env]
TEST_DB_VERSION = "dev-0aaede5"
