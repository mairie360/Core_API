[alias]

#This alias check the lint
lint_check = "fmt --all -- --check"

# This alias formats the code
lint_fix = "fmt --all"

# This alias check the code
check_code = "clippy --all-targets --all-features -- -W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo -D warnings"

# This alias generate the OpenAPI documentation
open_api = "run --example generate_openapi"

cov_test = ["llvm-cov", "--workspace", "--ignore-filename-regex", "main\\.rs|lib\\.rs", "--fail-under-lines", "60"]

cov = ["llvm-cov", "--workspace", "--ignore-filename-regex", "main\\.rs|lib\\.rs", "--fail-under-lines", "60", "--codecov", "--output-path", "codecov.json"]

# Version of the ghcr.io/mairie360/database and liquibase-migrations images the integration tests
# run against (read by mairie360_api_lib::test_setup), kept equal to the compose files: Database
# v3.0.1 (idx_users_name_order of the admin user list, MAIR-477). v3.0.1 is not released yet, so
# this pins the latest dev build of Database main (`dev-3c50ecb`, which carries v3.0.1): switch
# back to "3.0.1" here and in the compose files once it is published. mairie360_api_lib 3.0.0
# passes -Dallow_template_admin=true, so the migration seeds the template admin past MAIR-413.
# MAIR-505 (passkeys) needs the `user_passkeys` table of Database v3.1.0 (mairie360/Database#170):
# once that PR is merged, pin the `dev-<sha>` build it publishes here and in the compose files,
# then "3.1.0" once released, and drop `ensure_user_passkeys_table` (tests/common/passkey.rs), which
# creates the table itself until then.
# An exported TEST_DB_VERSION still wins.
[env]
# renovate: datasource=docker depName=ghcr.io/mairie360/database
TEST_DB_VERSION = "dev-3c50ecb"
