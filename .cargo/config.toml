[alias]

#This alias check the lint
lint_check = "fmt --all -- --check"

# This alias formats the code
lint_fix = "fmt --all"

# This alias check the code
check_code = "clippy --all-targets --all-features -- -W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo -D warnings"

# This alias generate the OpenAPI documentation
open_api = "run --example generate_openapi"

cov_test = ["llvm-cov", "--workspace", "--ignore-filename-regex", "main\\.rs|lib\\.rs", "--fail-under-lines", "60"]

cov = ["llvm-cov", "--workspace", "--ignore-filename-regex", "main\\.rs|lib\\.rs", "--fail-under-lines", "60", "--codecov", "--output-path", "codecov.json"]

# Version of the ghcr.io/mairie360/database and liquibase-migrations images the integration tests
# run against (read by mairie360_api_lib::test_setup), kept equal to the compose files: the dev
# build of Database main `dev-ec4f539`, the first carrying the one-role-per-user key of MAIR-564
# (`mair-564-01`, `user_roles_pkey` on `user_id`) that the grant's `ON CONFLICT (user_id)` needs.
# Database v3.1.0 is not released yet: switch to "3.1.0" here and in the compose files once it
# is. mairie360_api_lib passes -Dallow_template_admin=true, so the migration seeds the template
# admin past MAIR-413.
# An exported TEST_DB_VERSION still wins.
[env]
# renovate: datasource=docker depName=ghcr.io/mairie360/database
TEST_DB_VERSION = "dev-ec4f539"
