# Integration test stack (MAIR-117): the same services as docker-compose.yml plus a `newman`
# runner that replays the committed Postman collection against the API over the compose network.
# Run it with ./integration_test.sh (this is what the CICD `integration_tests` job executes).
volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 3000
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  # Core connects with its own role, like in staging/prod (MAIR-556): a query its grants do not
  # cover fails here. The superuser stays for postgres, liquibase and the seeder.
  DB_USER: core_api
  DB_HOST: postgres
  DB_PASSWORD: core-api-password
  DB_PORT: 5432

services:
  postgres:
    image: ghcr.io/mairie360/database:dev-90c22bb
    restart: always
    container_name: mairie360-db-core-api-integration
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:dev-90c22bb
    container_name: mairie360-liquibase-core-api-integration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 refuses to seed the admin (users.id = 1) without credentials: this
    # throwaway stack uses the public template admin. Never pass the flag on a real instance.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
      -Dcore_api_password=core-api-password
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-core-api-integration
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    container_name: core-api-integration
    # The API under test: the published ghcr.io/mairie360/core-api:dev-<sha> image in CI, or
    # core-api:local built by the *_test.sh script from development.Dockerfile. No build: block,
    # so CI tests the artifact that gets promoted instead of recompiling the sources.
    image: ${IMAGE_REF:?IMAGE_REF must name the API image under test, run the matching *_test.sh script}
    restart: always
    expose:
      - "3000"
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *common-env
      PUBLIC_URL: http://core.development.mairie360.fr
      # Random per run, generated by stack_secrets.sh (MAIR-428): run the matching *_test.sh script.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
      # Serves /api-docs/openapi.json, read by the collection (MAIR-424), off in production.
      SWAGGER_ENABLED: "true"
      # E-mails go to the fake Resend (MAIR-522), from no-reply@mairie360.local.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend:8080"
      EMAIL_DOMAIN: "mairie360.local"
      EMAIL_SENDER_NAME: "Mairie 360 (test)"
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The published image is distroless (no shell, no curl), so the API cannot carry its own
  # healthcheck: this sidecar polls /ready (Postgres and Redis reachable) and the services that need the API wait for it to
  # complete instead.
  core-ready:
    image: curlimages/curl:latest
    depends_on:
      core:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core:3000/ready >/dev/null; do
      echo "waiting for core..."; sleep 2; done; echo "core ready"'
    networks:
      - backend

  # Fake Resend API (MAIR-522): records the e-mails Core sends (tests/fake-resend/README.md).
  fake-resend:
    image: wiremock/wiremock:3.13.2
    container_name: mairie360-fake-resend-integration
    restart: always
    command: ["--port", "8080", "--global-response-templating", "--max-request-journal-entries", "10000"]
    volumes:
      - ./tests/fake-resend/mappings:/home/wiremock/mappings:ro
    expose:
      - "8080"
    networks:
      - backend

  # Replays tests/postman/collection.json against the `core` service. `baseUrl` is injected
  # here so the committed environment stays usable from a host shell (http://localhost:3000).
  # `--bail` stops at the first failing request; the exit code is what integration_test.sh returns.
  newman:
    image: postman/newman:6.1.3-alpine
    container_name: mairie360-newman-core-api
    networks:
      - backend
    volumes:
      - ./tests/postman:/etc/newman:ro
    depends_on:
      core-ready:
        condition: service_completed_successfully
      fake-resend:
        condition: service_started
    command: >
      run /etc/newman/collection.json
      --environment /etc/newman/environment.json
      --env-var baseUrl=http://core:3000
      --env-var jwt_secret=${JWT_SECRET}
      --bail
