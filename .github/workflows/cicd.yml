name: CoreAPI CI/CD

# Pull requests run lint, build and tests; a push to `main` also runs the releases and the
# integration, ZAP and k6 stacks (the reusable workflow gates them on `refs/heads/main`).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  APIs-cicd:
    uses: mairie360/CICD/.github/workflows/APIs_cicd.yml@f906c729412dfe9a09aaad92c504dd1deaa441c8 # v5.6.0
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      package_name: core-api
      cicd_version: v5.6.0
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
