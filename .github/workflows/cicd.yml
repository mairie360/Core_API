name: CoreAPI CI/CD

# Pull requests run lint, build and tests; a push to `main` also runs the releases and the
# integration, ZAP and k6 stacks (the reusable workflow gates them on `refs/heads/main`).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  APIs-cicd:
    # Pinned by commit (a re-pushed tag cannot change what runs); the comment and `cicd_version`
    # carry the tag, and Renovate bumps all three together (`mairie360/CICD` group, MAIR-427).
    uses: mairie360/CICD/.github/workflows/APIs_cicd.yml@539847726d4058a9565c4f682c2d1d8302874b06 # v4.0.1
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      package_name: core-api
      cicd_version: v4.0.1
    # Only the secrets the reusable workflow declares, instead of `secrets: inherit`.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
