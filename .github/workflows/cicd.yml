name: CoreAPI CI/CD

# Pull requests run lint, build and tests; a push to `main` also runs the releases and the
# integration, ZAP and k6 stacks (the reusable workflow gates them on `refs/heads/main`).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  APIs-cicd:
    uses: mairie360/CICD/.github/workflows/APIs_cicd.yml@c94b8ec6270dbcb842ad0a7ec81e6f5be55f3f6c # v4.3.2
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      package_name: core-api
      cicd_version: v4.3.2
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
