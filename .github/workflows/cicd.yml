name: CoreAPI CI/CD

# Pull requests run lint, build and tests; a push to `main` also runs the releases and the
# integration, ZAP and k6 stacks (the reusable workflow gates them on `refs/heads/main`).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  APIs-cicd:
    uses: mairie360/CICD/.github/workflows/APIs_cicd.yml@5b7d127d46f95d8951935b6209ca7c2ca857a21d # v4.2.1
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      package_name: core-api
      cicd_version: v4.2.1
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
