name: CoreAPI CI/CD

# Pull requests run lint, build and tests; a push to `main` also runs the releases and the
# integration, ZAP and k6 stacks (the reusable workflow gates them on `refs/heads/main`).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  APIs-cicd:
    uses: mairie360/CICD/.github/workflows/APIs_cicd.yml@7dfec94962d08ddfa55915bcb01c3ca6f71401c6 # v5.14.2
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      package_name: core-api
      cicd_version: v5.14.2
    secrets:
      ANTHROPIC_REVIEW_API_KEY: ${{ secrets.ANTHROPIC_REVIEW_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
