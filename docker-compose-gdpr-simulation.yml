# GDPR usage simulation stack (MAIR-497): the marker stack of MAIR-290 with the
# `gdpr-simulation` runner of mairie360/CICD (tests/gdpr/simulation), which plays
# gdpr-simulation.yaml with fictitious personas. gdpr_simulation_test.sh then back-dates rows, runs
# the purge and the database checks, and saves the logs of every container. Test stack only: the
# runner refuses to start without GDPR_SIMULATION=test-stack. No published port.
volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 3000
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_HOST: postgres
  DB_PASSWORD: password
  DB_PORT: 5432

x-depends-on: &depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:3000"]
  interval: 10s
  timeout: 5s
  retries: 5

x-service: &service-template
  image: ghcr.io/mairie360/service_name:latest
  pull_policy: always
  restart: always
  expose:
    - "3000"
  networks:
    - backend
  healthcheck:
    <<: *healthcheck

services:
  postgres:
    image: ghcr.io/mairie360/database:dev-3c50ecb
    restart: always
    container_name: mairie360-db-core-api-sim
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:dev-3c50ecb
    container_name: mairie360-liquibase-core-api-sim
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 refuses to seed the admin (users.id = 1) without credentials: this
    # throwaway stack uses the public template admin. Never pass the flag on a real instance.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-core-api-sim
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seeder:
    image: postgres:18-alpine
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    # ON_ERROR_STOP: a failing fixture must fail the stack.
    command: >
      psql -h postgres -U postgres -d mairie_360_database -v ON_ERROR_STOP=1 -f /init-test.sql
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
    networks:
      - backend

  core:
    container_name: core-api-sim
    # The API under test: the published ghcr.io/mairie360/core-api:dev-<sha> image in CI, or
    # core-api:local built by the *_test.sh script from development.Dockerfile. No build: block,
    # so CI tests the artifact that gets promoted instead of recompiling the sources.
    image: ${IMAGE_REF:?IMAGE_REF must name the API image under test, run the matching *_test.sh script}
    restart: always
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *common-env
      # The personas fail logins from one address on purpose (MAIR-425 limits would answer 429).
      RATE_LIMIT_ENABLED: "false"
      PUBLIC_URL: http://core.development.mairie360.fr
      # Random per run, generated by stack_secrets.sh (MAIR-428): run the matching *_test.sh script.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
      # Serves Swagger UI and /api-docs/openapi.json (MAIR-424), off in production.
      SWAGGER_ENABLED: "true"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      EMAIL_FROM: "noreply.mairie360@dev.local"
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The published image is distroless (no shell, no curl), so the API cannot carry its own
  # healthcheck: this sidecar polls /ready (Postgres and Redis reachable) and the services that need the API wait for it to
  # complete instead.
  core-ready:
    image: curlimages/curl:latest
    depends_on:
      core:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core:3000/ready >/dev/null; do
      echo "waiting for core..."; sleep 2; done; echo "core ready"'
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.31
    container_name: mairie360-mailpit-sim
    restart: always
    networks:
      - backend
    depends_on:
      core-ready:
        condition: service_completed_successfully

  gdpr-simulation:
    image: node:24-bookworm-slim
    user: "${GDPR_UID:-0}:${GDPR_GID:-0}"
    depends_on:
      core-ready:
        condition: service_completed_successfully
      seeder:
        condition: service_completed_successfully
    environment:
      ADMIN_JWT: ${ADMIN_JWT:?ADMIN_JWT must be set, run gdpr_simulation_test.sh}
      # The engine refuses to run without it (test stacks only).
      GDPR_SIMULATION: ${GDPR_SIMULATION:?GDPR_SIMULATION=test-stack must be set, run gdpr_simulation_test.sh}
      HOME: /tmp
    volumes:
      - ./cicd-repo/tests/gdpr:/engine:ro
      - ./gdpr-simulation.yaml:/journey/gdpr-simulation.yaml:ro
      - ./gdpr-marker.yaml:/journey/gdpr-marker.yaml:ro
      - ./gdpr-simulation:/run
    # The engine is copied out of the read-only mount before `npm ci` (no root-owned node_modules
    # in the host's cicd-repo/), like the marker runner (tests/gdpr/marker/run.sh).
    command:
      - sh
      - -c
      - >-
        mkdir -p /tmp/engine && tar -C /engine --exclude=./node_modules -cf - . | tar -C /tmp/engine -xf - &&
        cd /tmp/engine && npm ci --omit=dev --no-audit --no-fund --no-update-notifier --loglevel=error &&
        node simulation/simulate.mjs /journey/gdpr-simulation.yaml /run
    networks:
      - backend
