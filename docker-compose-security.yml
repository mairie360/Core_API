volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 3000
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  # Core connects with its own role, like in staging/prod (MAIR-556): a query its grants do not
  # cover fails here. The superuser stays for postgres, liquibase and the seeder.
  DB_USER: core_api
  DB_HOST: postgres
  DB_PASSWORD: core-api-password
  DB_PORT: 5432

x-depends-on: &depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:3000"]
  interval: 10s
  timeout: 5s
  retries: 5

x-service: &service-template
  image: ghcr.io/mairie360/service_name:latest
  pull_policy: always
  restart: always
  expose:
    - "3000"
  networks:
    - backend
  healthcheck:
    <<: *healthcheck

services:
  postgres:
    image: ghcr.io/mairie360/database:dev-ec4f539
    restart: always
    container_name: mairie360-db-core-api
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:dev-ec4f539
    container_name: mairie360-liquibase-core-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 refuses to seed the admin (users.id = 1) without credentials: this
    # throwaway stack uses the public template admin. Never pass the flag on a real instance.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
      -Dcore_api_password=core-api-password
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-core-api
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seeder:
    image: postgres:18-alpine
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    # ON_ERROR_STOP: a failing fixture must fail the stack, not leave ZAP scanning without users.
    command: >
      psql -h postgres -U postgres -d mairie_360_database -v ON_ERROR_STOP=1 -f /init-test.sql
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
    networks:
      - backend

  core:
    container_name: core-api-developpement
    # The API under test: the published ghcr.io/mairie360/core-api:dev-<sha> image in CI, or
    # core-api:local built by the *_test.sh script from development.Dockerfile. No build: block,
    # so CI tests the artifact that gets promoted instead of recompiling the sources.
    image: ${IMAGE_REF:?IMAGE_REF must name the API image under test, run the matching *_test.sh script}
    restart: always
    ports:
      - "3000:3000"
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *common-env
      PUBLIC_URL: http://core.development.mairie360.fr
      # Random per run, generated by stack_secrets.sh (MAIR-428): run the matching *_test.sh script.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
      # Serves Swagger UI and /api-docs/openapi.json (MAIR-424), off in production.
      SWAGGER_ENABLED: "true"
      # E-mails go to the fake Resend (MAIR-522), from no-reply@mairie360.local.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend:8080"
      EMAIL_DOMAIN: "mairie360.local"
      EMAIL_SENDER_NAME: "Mairie 360 (test)"
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The published image is distroless (no shell, no curl), so the API cannot carry its own
  # healthcheck: this sidecar polls /ready (Postgres and Redis reachable) and the services that need the API wait for it to
  # complete instead.
  core-ready:
    image: curlimages/curl:latest
    depends_on:
      core:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core:3000/ready >/dev/null; do
      echo "waiting for core..."; sleep 2; done; echo "core ready"'
    networks:
      - backend

  # Fake Resend API (MAIR-522): records the e-mails Core sends (tests/fake-resend/README.md).
  fake-resend:
    image: wiremock/wiremock:3.13.2
    container_name: mairie360-fake-resend
    restart: always
    command: ["--port", "8080", "--global-response-templating", "--max-request-journal-entries", "10000"]
    volumes:
      - ./tests/fake-resend/mappings:/home/wiremock/mappings:ro
    expose:
      - "8080"
    networks:
      - backend

  # nginx:
  #   image: nginx:1.29.1-bookworm
  #   restart: always
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #   ports:
  #     - "80:80"
  #   networks:
  #     - backend
  #   depends_on:
  #     core-ready:
  #       condition: service_completed_successfully

  security-scan:
    image: zaproxy/zap-stable
    networks:
      - backend
    depends_on:
      core-ready:
        condition: service_completed_successfully
      seeder:
        condition: service_completed_successfully
    volumes:
      - ./.zap/rules.tsv:/zap/wrk/rules.tsv:ro
      # OpenAPI coverage gate (MAIR-194), from the CICD checkout (see security_test.sh).
      - ./cicd-repo/tests/zap/zap_hooks.py:/zap/wrk/zap_hooks.py:ro
    # -t: the spec the API serves itself (utoipa), so ZAP imports every operation.
    # -O: the spec's `servers` (localhost:3000, development.mairie360.fr) are unreachable from
    #   this container; send every imported request to the `core` service instead.
    # -c rules.tsv: informational alerts are set to IGNORE; any other alert (WARN/FAIL) makes
    #   zap-api-scan.py exit != 0, which fails the job (no -I).
    # -z replacer: injects ADMIN_JWT (sub=1, the Admin seeded by liquibase, role=admin, signed
    #   with this run's JWT_SECRET by stack_secrets.sh) on every request, so the authenticated
    #   routes, /api/v1/admin/** included, are scanned instead of answering 401.
    # --hook zap_hooks.py: OpenAPI coverage gate (mairie360/CICD tests/zap). After the scan it maps
    #   every request ZAP sent to an operation of the spec and exits 1 when an operation was never
    #   reached, or when an operation that requires `jwt` only got 401/403.
    # -silent: no add-on update check or telemetry at daemon start (it can hang the scan with
    #   "Failed to connect to ZAP after 600 seconds").
    # -z is split with shlex: 'Bearer <jwt>' must stay quoted, otherwise ZAP only receives
    #   "Bearer" and the token is read as a file name.
    command:
      - zap-api-scan.py
      - -t
      - http://core:3000/api-docs/openapi.json
      - -f
      - openapi
      - -O
      - http://core:3000
      - -c
      - rules.tsv
      - --hook
      - /zap/wrk/zap_hooks.py
      - -z
      - "-silent -config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement='Bearer ${ADMIN_JWT:?ADMIN_JWT must be set, run security_test.sh}'"
